[project]
name = "highway-env"
description = "An environment for simulated highway driving tasks."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Edouard Leurent", email = "eleurent@gmail.com" }]
license = { text = "MIT License" }
keywords = ["Reinforcement Learning", "car simulation", "RL", "AI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
dependencies = [
    "gymnasium >=1.0.0a2",
    "farama-notifications >=0.0.1",
    "numpy >=1.21.0",
    "pygame >=2.0.2",
    "matplotlib",
    "pandas",
    "scipy",
    "imageio>=2.34",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pytz>=2024.1",
    "pyyaml>=6",
    "tqdm>=4.66",
    "typeguard>=4"
]
dynamic = ["version"]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov"
]
training = [
    "setuptools<81",
    "tensorboard>=2.16",
    "torch>=2.2",
    "wandb>=0.16"
]

[project.urls]
Homepage = "https://farama.org"
Repository = "https://github.com/treeizard/HighwayEnv-NGSIM"
Documentation = "https://highway-env.farama.org/"
"Bug Report" = "https://github.com/eleurent/highway-env/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "highway_env",
    "highway_env.*",
    "scripts_gail",
    "scripts_gail.*",
    "scripts_setup",
    "scripts_setup.*",
    "scripts_env_test",
    "scripts_env_test.*"
]

[tool.setuptools.package-data]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]

[tool.isort]
atomic = true
profile = "black"
src_paths = ["highway_env", "tests", "docs/_scripts"]
extra_standard_library = ["typing_extensions"]
indent = 4
lines_after_imports = 2
multi_line_output = 3
